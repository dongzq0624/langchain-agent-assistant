name: CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  # 前端构建
  build-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js and pnpm
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      
      - name: Install pnpm
        run: npm install -g pnpm@latest
        
      - name: Cache pnpm store
        uses: actions/cache@v3
        with:
          path: ~/.local/share/pnpm/store
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-
        
      - name: Install dependencies
        working-directory: ./frontend
        run: pnpm install --frozen-lockfile
        
      - name: Build frontend
        working-directory: ./frontend
        run: pnpm run build
        
      - name: Archive frontend build
        uses: actions/upload-artifact@v4
        with:
          name: frontend-build
          path: frontend/dist
          retention-days: 1

  # 后端测试
  test-backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js and pnpm
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          
      - name: Install pnpm
        run: npm install -g pnpm@latest
          
      - name: Cache pnpm store
        uses: actions/cache@v3
        with:
          path: ~/.local/share/pnpm/store
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-
          
      - name: Install dependencies
        working-directory: ./backend
        run: pnpm install --frozen-lockfile
        
      - name: Type check
        working-directory: ./backend
        run: npx tsc --noEmit
        
      - name: Run tests (if any)
        working-directory: ./backend
        run: pnpm test || echo "No tests configured"
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}

  # 部署到生产环境
  deploy:
    needs: [build-frontend, test-backend]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    
    environment: 
      name: production
      url: http://101.37.236.214
    
    concurrency: 
      group: production-deploy
      cancel-in-progress: false
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Download frontend build
        uses: actions/download-artifact@v4
        with:
          name: frontend-build
          path: frontend/dist
          
      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.ECS_SSH_KEY }}
          
      - name: Debug SSH configuration
        run: |
          echo "Testing SSH connectivity..."
          echo "Server: 101.37.236.214"
          echo "User: root"
          echo ""
          
          # 检查 SSH 代理
          echo "SSH_AUTH_SOCK: $SSH_AUTH_SOCK"
          ssh-add -l || echo "No keys in agent"
          echo ""
          
          # 测试连接（详细模式）
          echo "Attempting SSH connection..."
          ssh -v -o StrictHostKeyChecking=no -o ConnectTimeout=10 root@101.37.236.214 "echo 'Connection successful'; whoami; hostname" || {
            echo "❌ SSH connection failed!"
            echo ""
            echo "可能的原因："
            echo "1. SSH 密钥未正确配置到 GitHub Secrets (ECS_SSH_KEY)"
            echo "2. 服务器防火墙阻止了 SSH 连接（端口 22）"
            echo "3. 服务器 IP 地址变更"
            echo "4. SSH 服务未运行"
            echo ""
            echo "排查步骤："
            echo "1. 验证 GitHub Secret 'ECS_SSH_KEY' 包含完整的私钥"
            echo "2. 本地测试: ssh -i your-key.pem root@101.37.236.214"
            echo "3. 检查阿里云安全组是否开放端口 22"
            exit 1
          }
          
      - name: Verify server connection
        run: |
          ssh -o StrictHostKeyChecking=no -o ConnectTimeout=30 root@101.37.236.214 << 'EOF'
            echo "✅ Server connection verified"
            echo "Hostname: $(hostname)"
            echo "Uptime: $(uptime)"
            echo "Disk usage:"
            df -h / | tail -1
            echo ""
            echo "Node.js version:"
            node --version || echo "Node.js not installed"
            echo ""
            echo "pnpm version:"
            pnpm --version || echo "pnpm not installed"
            echo ""
            echo "PM2 status:"
            pm2 list || echo "PM2 not running"
          EOF
          
      - name: Backup current deployment
        run: |
          ssh root@101.37.236.214 << 'EOF'
            cd /opt/backend
            if [ -d "backup" ]; then
              rm -rf backup
            fi
            mkdir -p backup
            cp -r src package.json pnpm-lock.yaml tsconfig.json ecosystem.config.cjs backup/ 2>/dev/null || true
            echo "✅ Backup created"
          EOF
          
      - name: Deploy backend
        run: |
          echo "📦 Uploading backend files..."
          
          # 上传后端代码和 lock 文件
          scp -o StrictHostKeyChecking=no \
            -r \
            ./backend/src \
            ./backend/package.json \
            ./backend/pnpm-lock.yaml \
            ./backend/tsconfig.json \
            ./backend/ecosystem.config.cjs \
            root@101.37.236.214:/opt/backend/ || {
            echo "❌ Failed to upload backend files"
            exit 1
          }
          
          echo "✅ Backend files uploaded successfully"
          echo ""
          echo "🚀 Deploying backend..."
          
          # 登录服务器并部署
          ssh -o StrictHostKeyChecking=no root@101.37.236.214 << 'EOF'
            set -e  # 遇到错误立即退出
            
            cd /opt/backend
            
            echo "Step 1: Ensuring pnpm is installed..."
            # 确保安装了 pnpm
            if ! command -v pnpm &> /dev/null; then
              echo "Installing pnpm..."
              npm install -g pnpm@latest
            else
              echo "pnpm is already installed: $(pnpm --version)"
            fi
            
            echo ""
            echo "Step 2: Installing dependencies..."
            # 使用 pnpm 安装依赖（严格模式，使用 lock 文件）
            pnpm install --frozen-lockfile
            
            echo ""
            echo "Step 3: Restarting service..."
            # 重启服务
            if pm2 list | grep -q "ai-onboarding"; then
              pm2 reload ai-onboarding
            else
              pm2 start ecosystem.config.cjs
            fi
            
            # 等待服务启动
            echo "Waiting for service to start..."
            sleep 5
            
            # 验证服务状态
            echo ""
            echo "Step 4: Verifying service status..."
            pm2 status ai-onboarding
            
            # 检查进程是否在运行
            if pm2 list | grep "ai-onboarding" | grep -q "online"; then
              echo "✅ Backend service is running"
            else
              echo "❌ Backend service failed to start"
              pm2 logs ai-onboarding --err --lines 20
              exit 1
            fi
          EOF
          
          echo "✅ Backend deployment completed"
          
      - name: Deploy frontend
        run: |
          echo "📦 Deploying frontend..."
          
          # 备份当前版本
          ssh -o StrictHostKeyChecking=no root@101.37.236.214 << 'EOF'
            if [ -d "/var/www/ai-onboarding" ]; then
              echo "Backing up current frontend..."
              mv /var/www/ai-onboarding /var/www/ai-onboarding.bak.$(date +%Y%m%d_%H%M%S)
            fi
            mkdir -p /var/www/ai-onboarding
            echo "✅ Frontend directory ready"
          EOF
          
          echo "Uploading frontend files..."
          # 上传前端构建文件
          scp -o StrictHostKeyChecking=no \
            -r \
            ./frontend/dist/* \
            root@101.37.236.214:/var/www/ai-onboarding/ || {
            echo "❌ Failed to upload frontend files"
            exit 1
          }
          
          echo "✅ Frontend files uploaded"
          echo ""
          echo "Reloading Nginx..."
          
          # 重载 Nginx
          ssh -o StrictHostKeyChecking=no root@101.37.236.214 << 'EOF'
            systemctl reload nginx || {
              echo "❌ Failed to reload Nginx"
              systemctl status nginx
              exit 1
            }
            echo "✅ Nginx reloaded successfully"
          EOF
          
          echo "✅ Frontend deployment completed"
          
      - name: Health check
        run: |
          echo "⏳ Waiting for service to be ready..."
          sleep 10
          
          # 检查健康端点
          if curl -f http://101.37.236.214/health; then
            echo "✅ Health check passed"
          else
            echo "⚠️ Health endpoint not available, checking main page..."
            curl -f http://101.37.236.214/ || exit 1
          fi
          
      - name: Output deployment information
        run: |
          echo ""
          echo "╔═══════════════════════════════════════════════════════════╗"
          echo "║                                                           ║"
          echo "║              🎉 部署成功！                                 ║"
          echo "║                                                           ║"
          echo "╚═══════════════════════════════════════════════════════════╝"
          echo ""
          echo "📍 部署信息："
          echo "   • 应用地址: http://101.37.236.214"
          echo "   • API 地址: http://101.37.236.214/api"
          echo "   • 提交哈希: ${{ github.sha }}"
          echo "   • 分支: ${{ github.ref_name }}"
          echo "   • 触发者: ${{ github.actor }}"
          echo "   • 部署时间: $(date '+%Y-%m-%d %H:%M:%S')"
          echo ""
          echo "🔗 快速访问："
          echo "   • 首页: http://101.37.236.214"
          echo "   • 健康检查: http://101.37.236.214/health"
          echo ""
          echo "📊 监控命令："
          echo "   • 查看后端日志: ssh root@101.37.236.214 'pm2 logs ai-onboarding'"
          echo "   • 查看服务状态: ssh root@101.37.236.214 'pm2 status'"
          echo "   • 查看 Nginx 日志: ssh root@101.37.236.214 'tail -f /var/log/nginx/ai-onboarding-error.log'"
          echo ""
          
      - name: Notify deployment success
        if: success()
        run: |
          echo "✅ 部署成功完成！"
          echo "🌐 访问地址: http://101.37.236.214"
        
      - name: Notify deployment failure
        if: failure()
        run: |
          echo "❌ 部署失败！"
          echo ""
          echo "🔍 故障排查步骤："
          echo "   1. 查看 GitHub Actions 完整日志"
          echo "   2. 检查服务器状态: ssh root@101.37.236.214 'pm2 status'"
          echo "   3. 查看后端日志: ssh root@101.37.236.214 'pm2 logs ai-onboarding --err'"
          echo "   4. 查看 Nginx 错误: ssh root@101.37.236.214 'tail -50 /var/log/nginx/ai-onboarding-error.log'"
          echo ""
          echo "🔄 回滚操作："
          echo "   ssh root@101.37.236.214 'cd /opt/backend && cp -r backup/* . && pnpm install --frozen-lockfile && pm2 restart ai-onboarding'"
          exit 1
