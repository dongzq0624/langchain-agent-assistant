name: CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  # 前端构建
  build-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          
      - name: Install dependencies
        working-directory: ./frontend
        run: npm install
        
      - name: Build frontend
        working-directory: ./frontend
        run: npm run build
        
      - name: Archive frontend build
        uses: actions/upload-artifact@v4
        with:
          name: frontend-build
          path: frontend/dist

  # 后端测试
  test-backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          
      - name: Install dependencies
        working-directory: ./backend
        run: npm install --legacy-peer-deps
        
      - name: Run tests (if any)
        working-directory: ./backend
        run: npm test || echo "No tests configured"

  # 部署
  deploy:
    needs: [build-frontend, test-backend]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Download frontend build
        uses: actions/download-artifact@v4
        with:
          name: frontend-build
          path: frontend/dist
          
      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.ECS_SSH_KEY }}
          
      - name: Deploy backend
        run: |
          # 上传后端代码
          scp -r ./backend/src/* ./backend/package.json ./backend/package-lock.json ./backend/tsconfig.json ./backend/ecosystem.config.cjs ./backend/pdfs/* root@101.37.236.214:/opt/backend/
          
          # 登录服务器并部署
          ssh root@101.37.236.214 << 'EOF'
            cd /opt/backend
            npm install --legacy-peer-deps
            pm2 restart ai-onboarding
          EOF
          
      - name: Deploy frontend
        run: |
          # 上传前端构建文件
          scp -r ./frontend/dist/* root@101.37.236.214:/var/www/ai-onboarding/
          
          # 重启 Nginx
          ssh root@101.37.236.214 << 'EOF'
            systemctl reload nginx
          EOF
