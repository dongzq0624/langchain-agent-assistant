name: CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  # 前端构建
  build-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'
          cache-dependency-path: './frontend/pnpm-lock.yaml'
      
      - name: Install pnpm
        run: npm install -g pnpm
        
      - name: Install dependencies
        working-directory: ./frontend
        run: pnpm install
        
      - name: Build frontend
        working-directory: ./frontend
        run: pnpm run build
        
      - name: Archive frontend build
        uses: actions/upload-artifact@v4
        with:
          name: frontend-build
          path: frontend/dist

  # 后端测试
  test-backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'
          cache-dependency-path: './backend/pnpm-lock.yaml'
          
      - name: Install pnpm
        run: npm install -g pnpm
          
      - name: Install dependencies
        working-directory: ./backend
        run: pnpm install --frozen-lockfile
        
      - name: Type check
        working-directory: ./backend
        run: npx tsc --noEmit
        
      - name: Run tests (if any)
        working-directory: ./backend
        run: pnpm test || echo "No tests configured"
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}

  # 部署
  deploy:
    needs: [build-frontend, test-backend]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    
    environment: production
    concurrency: 
      group: production-deploy
      cancel-in-progress: false
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Download frontend build
        uses: actions/download-artifact@v4
        with:
          name: frontend-build
          path: frontend/dist
          
      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.ECS_SSH_KEY }}
          
      - name: Verify server connection
        run: |
          ssh -o StrictHostKeyChecking=no root@101.37.236.214 "echo 'Server connection OK'"
          
      - name: Backup current deployment
        run: |
          ssh root@101.37.236.214 << 'EOF'
            cd /opt/backend
            if [ -d "backup" ]; then
              rm -rf backup
            fi
            mkdir -p backup
            cp -r src package.json pnpm-lock.yaml tsconfig.json ecosystem.config.cjs backup/ 2>/dev/null || true
            echo "Backup created"
          EOF
          
      - name: Deploy backend
        run: |
          # 上传后端代码和 lock 文件
          scp -r \
            ./backend/src \
            ./backend/package.json \
            ./backend/pnpm-lock.yaml \
            ./backend/tsconfig.json \
            ./backend/ecosystem.config.cjs \
            root@101.37.236.214:/opt/backend/
          
          # 登录服务器并部署
          ssh root@101.37.236.214 << 'EOF'
            cd /opt/backend
            
            # 安装 pnpm（如果未安装）
            which pnpm || npm install -g pnpm
            
            # 使用 pnpm 安装依赖（严格模式，使用 lock 文件）
            pnpm install --frozen-lockfile
            
            # 重启服务
            pm2 reload ai-onboarding || pm2 start ecosystem.config.cjs
            
            # 等待服务启动
            sleep 5
            
            # 验证服务状态
            pm2 status ai-onboarding
          EOF
          
      - name: Deploy frontend
        run: |
          # 备份当前版本
          ssh root@101.37.236.214 << 'EOF'
            if [ -d "/var/www/ai-onboarding" ]; then
              mv /var/www/ai-onboarding /var/www/ai-onboarding.bak
            fi
            mkdir -p /var/www/ai-onboarding
          EOF
          
          # 上传前端构建文件
          scp -r ./frontend/dist/* root@101.37.236.214:/var/www/ai-onboarding/
          
          # 清理备份并重载 Nginx
          ssh root@101.37.236.214 << 'EOF'
            rm -rf /var/www/ai-onboarding.bak
            systemctl reload nginx
          EOF
          
      - name: Health check
        run: |
          sleep 10
          curl -f http://101.37.236.214/health || exit 1
          
      - name: Notify deployment success
        if: success()
        run: echo "✅ 部署成功！"
        
      - name: Notify deployment failure
        if: failure()
        run: |
          echo "❌ 部署失败！"
          echo "请检查 GitHub Actions 日志和服务器状态"
